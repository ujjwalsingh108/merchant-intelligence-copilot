# Local dev environment (Postgres, PgAdmin, App)
version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: olist_db
    ports:
      - "5432:5432"
    volumes:
      - merchant_copilot_postgres_data:/var/lib/postgresql/data

volumes:
  merchant_copilot_postgres_data: