[tool.poetry]
name = "merchant-intelligence-copilot"
version = "0.1.0"
description = "Agentic BI workflow for e-commerce merchants"
authors = ["Ujjwal Singh <usingh2051@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"

# --- Core API & Config ---
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"     # For production-grade environment variable validation

# --- AI, Orchestration & Observability ---
langgraph = "^0.0.30"            # State machine for the agent workflow
langchain = "^0.1.13"
langchain-groq = "^0.1.2"        # Core wrapper for Groq
langchain-anthropic = "^0.1.4"   # (Optional) If you want to use Claude 3.5 Sonnet
langsmith = "^0.1.38"            # LLM tracing, evaluations, and observability
tiktoken = "^0.6.0"              # Token counting for cost estimation

# --- Database & Data Retrieval ---
sqlalchemy = "^2.0.29"           # ORM and connection pooling
psycopg2-binary = "^2.9.9"       # PostgreSQL synchronous adapter
asyncpg = "^0.29.0"              # PostgreSQL asynchronous adapter (recommended for FastAPI)
qdrant-client = "^1.8.2"         # Vector DB for semantic caching and schema RAG
langchain-qdrant = "^0.1.1"      # LangChain integration for Qdrant

# --- Sandboxing & Code Execution ---
e2b-code-interpreter = "^0.0.10" # Secure, ephemeral Python sandboxing
pandas = "^2.2.1"                # For local data transformations if needed before sending to LLM

[tool.poetry.group.dev.dependencies]
# --- Testing & Evaluation ---
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"       # For testing async FastAPI endpoints
httpx = "^0.27.0"                # Required for FastAPI TestClient
ragas = "^0.1.7"                 # Framework for evaluating RAG/Agent retrieval pipelines

# --- Linting & Formatting ---
ruff = "^0.3.4"                  # Fast linter (replaces flake8/isort)
black = "^24.3.0"                # Code formatter
mypy = "^1.9.0"                  # Static type checker

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
